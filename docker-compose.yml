services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: es_espanol_facil
      DB_USER: app_user
      DB_PASSWORD: ${DB_PASSWORD:-demo_app_local}
      TZ: Europe/Moscow
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: es_espanol_facil
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo_root_local}
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo_app_local}
      TZ: Europe/Moscow
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/demo_seed.sql:/docker-entrypoint-initdb.d/02_demo_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
